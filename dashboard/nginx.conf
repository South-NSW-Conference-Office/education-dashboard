# Rate-limit key: the real client IP forwarded by snswserver's shared
# nginx-proxy (only that proxy can reach this container); direct hits fall
# back to the connection address so the key is never empty.
map $http_x_real_ip $limit_key {
    default $http_x_real_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $limit_key zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The backend on morpheus, over Tailscale (snswserver is on the tailnet).
    # Everything under /api — the v1 API, Better Auth (/api/auth/*) and the
    # SSO probe (/api/sso/*) — lands there, mirroring the Vite dev proxy.
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://100.87.6.30:4200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF uploads (monthly operating reports) exceed nginx's 1m default.
        client_max_body_size 25m;
    }

    # React Router client-side routes — always fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
