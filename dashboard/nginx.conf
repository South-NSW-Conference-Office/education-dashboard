server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The backend on morpheus, over Tailscale (snswserver is on the tailnet).
    # Everything under /api — the v1 API, Better Auth (/api/auth/*) and the
    # SSO probe (/api/sso/*) — lands there, mirroring the Vite dev proxy.
    location /api/ {
        proxy_pass http://100.87.6.30:4200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF uploads (monthly operating reports) exceed nginx's 1m default.
        client_max_body_size 25m;
    }

    # React Router client-side routes — always fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
