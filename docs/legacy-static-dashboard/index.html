<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNSW Adventist Education — Dashboards</title>
<link rel="icon" href="assets/logo-adventist-education.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Boards">
    <div class="brand">
      <img src="assets/logo-adventist-education.png" alt="Adventist Education">
      <div><b>SNSW Adventist Education</b><span>Dashboards</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <b>Phase 1</b> · figures come from the data files and edits are kept in this browser.<br>
      Live MYOB / Synergetic / Hubworks feeds are planned for phase 2.
    </div>
  </aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json" hidden>

<!-- Data: one file per board. Phase 2 replaces these with an API. -->
<script src="data/schools.js"></script>
<script src="data/databoard.js"></script>
<script src="data/finance-bcc.js"></script>
<script src="data/finance-ncs.js"></script>
<script src="data/finance-ccs.js"></script>
<script src="data/finance-ccs-elc.js"></script>
<!-- App -->
<script src="js/core.js"></script>
<script src="js/finance.js"></script>
<script src="js/databoard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
